<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Structural Grid Accent Lines -->
  <g opacity="0.15" stroke="#f59e0b" stroke-width="2">
    <line x1="60" y1="180" x2="452" y2="180"/>
    <line x1="60" y1="332" x2="452" y2="332"/>
    <line x1="180" y1="60" x2="180" y2="452"/>
    <line x1="332" y1="60" x2="332" y2="452"/>
    <line x1="60" y1="60" x2="452" y2="452"/>
    <line x1="60" y1="452" x2="452" y2="60"/>
  </g>

  <!-- Central Building/Girder Structure Icon -->
  <g transform="translate(126, 80)">
    <!-- Tower Pillars -->
    <rect x="30" y="40" width="28" height="180" rx="6" fill="url(#goldGrad)" filter="url(#glow)"/>
    <rect x="202" y="40" width="28" height="180" rx="6" fill="url(#goldGrad)" filter="url(#glow)"/>
    
    <!-- Cross Bracing (Charpente Métallique) -->
    <line x1="58" y1="50" x2="202" y2="120" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="202" y1="50" x2="58" y2="120" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="58" y1="120" x2="202" y2="210" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="202" y1="120" x2="58" y2="210" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="44" y1="45" x2="216" y2="45" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="44" y1="215" x2="216" y2="215" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Top Crane/Apex Beam -->
    <polygon points="130,5 210,40 50,40" fill="url(#goldGrad)"/>
  </g>

  <!-- GC58 Brand Typography -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="78" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    GC<tspan fill="url(#goldGrad)">58</tspan>
  </text>
  <text x="256" y="425" font-family="'Cairo', Arial, sans-serif" font-weight="800" font-size="24" fill="#94a3b8" text-anchor="middle" letter-spacing="6">
    FORMATIONS
  </text>

  <!-- Glowing Indicator Dot -->
  <circle cx="256" cy="460" r="6" fill="#10b981" filter="url(#glow)"/>
</svg>
